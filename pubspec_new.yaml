
name: flutter_pdf
description: "PDF阅读器 - 支持OCR文字识别的智能PDF工具"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # PDF渲染
  syncfusion_flutter_pdfviewer: ^27.1.48

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 本地持久化
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 文件选择
  file_picker: ^8.0.0

  # OCR文字识别
  google_mlkit_text_recognition: ^0.14.0

  # 图像处理
  image: ^4.2.0

  # 路径工具
  path_provider: ^2.1.4
  path: ^1.9.0

  # UI工具
  flutter_spinkit: ^5.2.1
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
