name: flutter_pdf
description: "ZeronPDF"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # PDF rendering & manipulation
  syncfusion_flutter_pdfviewer:
    path: third_party/syncfusion_flutter_pdfviewer
  syncfusion_flutter_pdf: ^28.1.33
  
  # Local compatibility patch for the Android SurfaceProducer API.
  pdfx:
    path: third_party/pdfx

  # State management
  flutter_riverpod: ^2.6.1

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # File picking
  file_picker: ^11.0.2

  # Image processing
  image: ^4.5.2

  # Path utilities
  path_provider: ^2.1.5
  path: ^1.9.0

  # UI utilities
  flutter_spinkit: ^5.2.1
  share_plus: ^12.0.2
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
