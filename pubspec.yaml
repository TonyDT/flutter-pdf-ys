name: gptesting
description: "Google Play 12+14 Day Testing Assistant"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 基础工具
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  path: ^1.9.0
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  share_plus: ^9.0.0

  # 应用管理
  installed_apps: ^1.0.2

  # UI 增强
  flutter_spinkit: ^5.2.1
  intl: ^0.19.0
  http: ^1.6.0
  screenshot: ^3.0.0
  # 使用兼容 AGP 8.0 的版本替换 image_gallery_saver
  saver_gallery: ^3.0.1
  permission_handler: ^12.0.2
  device_info_plus: ^10.1.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
