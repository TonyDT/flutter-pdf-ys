name: flutter_pdf
description: "ZeronPDF"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # PDF rendering & manipulation
  syncfusion_flutter_pdfviewer: ^28.1.33
  syncfusion_flutter_pdf: ^28.1.33
  
  # 使用 pdfx 替代 pdfrx，解决编译冲突，兼容 Dart 3.6.2
  pdfx: ^2.7.1

  # State management
  flutter_riverpod: ^2.6.1

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # File picking
  file_picker: ^11.0.2

  # Image processing
  image: ^4.5.2

  # Path utilities
  path_provider: ^2.1.5
  path: ^1.9.0

  # UI utilities
  flutter_spinkit: ^5.2.1
  share_plus: ^12.0.2

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
