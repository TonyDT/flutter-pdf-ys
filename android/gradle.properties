# JVM 内存配置
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# AndroidX 和 Jetifier
android.useAndroidX=true
android.enableJetifier=true

# 忽略 Kotlin JVM 目标验证错误
kotlin.jvm.target.validation.mode=WARNING

# Gradle 性能优化
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# Kotlin 增量编译
kotlin.incremental=true
kotlin.incremental.classpath=true
kotlin.incremental.kapt=true

# 禁用不必要的任务
# android.enableBuildCache 已弃用 (AGP 7.0+)
# 使用 Gradle 构建缓存替代: org.gradle.caching=true
android.enableProfileJson=false
android.useFullClasspathForDexingTransform=true
